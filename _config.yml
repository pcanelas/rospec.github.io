repository: pcanelas/rspoec.github.io

output: web

topnav_title: ROSpec Documentation 

site_title: ROSPEC - Specification Language for Component-based Robotic Systems

company_name: Copyright 2021 Google LLC

github_editme_path: pcanelas/rospec.github.io/ # tomjoht/documentation-theme-jekyll/blob/gh-pages/
# if you're using Github, provide the basepath to the branch you've created for reviews, following the sample here. if not, leave this value blank.

google_analytics: G-RDH7SLYJ9C

host: 127.0.0.1

port: 4000

exclude:
  - .idea/
  - .gitignore
  - vendor

feedback_disable: true

# library used for syntax highlighting
highlighter: rouge
markdown: kramdown

# filter used to process markdown.
kramdown:
 input: GFM
 auto_ids: true
 hard_wrap: false
 syntax_highlighter: rouge

collections:
  tooltips:
    output: false
# collections are declared here. this renders the content in _tooltips and processes it, but doesn't output it as actual files in the output unless you change output to true

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: false
      # if you don't want to use Commento.io and just hide comments, change true to false wherever you see the comments property
      search: false
      sidebar: home_sidebar
      topnav: topnav
  -
    scope:
      path: ""
      type: "tooltips"
    values:
      layout: "page"
      search: false
      tooltip: true

  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      # if you don't want to use Commento.io and just hide comments, change true to false wherever you see the comments property
      search: false
      sidebar: home_sidebar
      topnav: topnav

# these are defaults used for the frontmatter for these file types

sidebars:
- home_sidebar
- mydoc_sidebar

description: "ROSPEC is a domain-specific language that allows users to turn explicit assumptions about the robotic system. The set of features in the language allow the user to describe the structural and behavioral architecture of the system."

github: [metadata]


# Copyright 2021 Google LLC
